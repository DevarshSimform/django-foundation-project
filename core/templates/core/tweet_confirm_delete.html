{% extends 'layout.html' %}

{% block title %}Delete Tweet{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg rounded-4 p-4 border-0">
        <h2 class="text-center mb-4">Confirm Delete</h2>
        <p class="text-center">Are you sure you want to delete this tweet?</p>

        {% if tweet.img %}
            <img src="{{ tweet.img.url }}" class="card-img-top rounded-3 mb-3" 
                alt="Tweet Image" style="height: 200px; object-fit: cover;">
        {% endif %}

        <div class="text-center">
            <p>{{ tweet.text }}</p>
            <form method="post" action="{% url 'tweet_delete' tweet.id %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
                <a href="{% url 'my_tweets' %}" class="btn btn-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
