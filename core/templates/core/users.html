{% extends "layout.html" %}

{% block content %}

<h1 class="text-center mt-5">Users</h1>

<div class="container">
    <div id="tweet-container" class="row row-cols-1 row-cols-md-3 g-4">
        {% for profile in profiles %}
        <div class="col tweet-card">
            <a href="{% url "profile" profile.user.username %}">
                <div class="card h-100 shadow-lg p-3 rounded-4 border-0" style="background-color: #f8f9fa;">
                    <img src="{{ profile.avatar.url }}" alt="{{ user.username }}" class="rounded-circle me-3" width="50" height="50">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-dark fw-bold">{{ profile.user.username }}</h5>
                        <p class="card-text text-muted flex-grow-1">{{ profile.bio }}</p>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>

</div>

{% endblock %}
