{% extends "layout.html" %}
{% load crispy_forms_tags %}

{% block title %}
User Login
{% endblock %}

{% block content %}

<form method="post" class="form">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">Submit</button>
</form>

<p>Don't have an account?<a href="{% url 'register'%}">Register here</a></p>

{% endblock %}
