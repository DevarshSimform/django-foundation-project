{% extends "layout.html" %}
{% load crispy_forms_tags %}

{% block title %}
User Register
{% endblock %}

{% block content %}

<form method="post" class="form">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">Submit</button>
</form>
<p>Already have an account?<a href="{% url 'login'%}">Login here</a></p>


{% endblock %}
